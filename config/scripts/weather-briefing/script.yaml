alias: 날씨 알려줘
description: 날씨 센서로 Gemini가 날씨 안내 원고를 생성하고 거실 스피커로 재생 (생성 최대 3회 시도)
sequence:
  - repeat:
      count: 3
      sequence:
        - variables:
            ai_response: {}
        - action: ai_task.generate_data
          data:
            task_name: 날씨 알려줘
            entity_id: ai_task.google_ai_task
            instructions: >-
              당신은 라디오에서 지역 날씨를 전하는 기상캐스터입니다.
              아래 자료만 바탕으로 스피커에서 바로 읽을 한국어 날씨 방송 원고를 작성하세요.
              차분하고 또렷하면서도 부드러운 존댓말을 사용하세요.
              청취자에게 개인적인 호칭을 붙이거나 반말하지 마세요.
              방송사명, 기상캐스터 이름, 실제 방송 출연이나 공식 기관 소속을 만들어내지 마세요.

              안내 요청 시각은 {{ now().strftime('%m월 %d일 %H시 %M분') }}입니다.
              이 시각을 센서의 관측·갱신 시각으로 설명하지 마세요.

              [날씨 자료]
              현재 날씨: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaenalssi') }}
              현재 기온: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaeondo') }} °C
              체감온도: {{ states('sensor.naver_weather_hopyeongdong_nalssi_cegamondo') }} °C
              오늘 최저기온: {{ states('sensor.naver_weather_hopyeongdong_nalssi_coejeoondo') }} °C
              오늘 최고기온: {{ states('sensor.naver_weather_hopyeongdong_nalssi_coegoondo') }} °C
              습도: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaeseubdo') }} %
              강수확률: {{ states('sensor.naver_weather_hopyeongdong_nalssi_gangsuhwagryul') }} %
              풍향: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaepunghyang') }}
              풍속: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaepungsog') }} m/s
              통합대기: {{ states('sensor.naver_weather_hopyeongdong_nalssi_tonghabdaegi') }}
              미세먼지 농도: {{ states('sensor.naver_weather_hopyeongdong_nalssi_misemeonji') }} ㎍/㎥
              미세먼지 등급: {{ states('sensor.naver_weather_hopyeongdong_nalssi_misemeonjideunggeub') }}
              초미세먼지 농도: {{ states('sensor.naver_weather_hopyeongdong_nalssi_comisemeonji') }} ㎍/㎥
              초미세먼지 등급: {{ states('sensor.naver_weather_hopyeongdong_nalssi_comisemeonjideunggeub') }}
              자외선 등급: {{ states('sensor.naver_weather_hopyeongdong_nalssi_jaoeseondeunggeub') }}

              원고 구성:
              현재 날씨의 특징을 한 문장으로 짚으며 시작하고, 현재 기온과 체감온도를 연결하세요.
              이어 오늘 최저·최고기온, 강수확률과 습도, 미세먼지와 초미세먼지 상태를 전하세요.
              관련된 정보는 한두 문장으로 묶고, 주제가 바뀔 때만 짧게 연결하세요.
              바람과 자외선 정보는 제공된 수치나 등급상 주의가 필요할 때 짧게 덧붙이세요.
              먼지는 제공된 등급을 우선 사용하고, 등급 없이 농도만 있으면 수치만 전하세요.
              마지막에는 확인 가능한 날씨에 맞춰 우산이나 옷차림 등 외출 참고사항을 한 문장으로 전하세요.
              참고사항을 뒷받침할 정보가 부족하면 생략하세요.

              말투와 형식:
              '~입니다', '~보이고 있습니다', '~인데요', '~하시기 바랍니다' 등의 방송체를
              내용에 맞게 섞되, 같은 어미나 연결 표현을 매 문장 반복하지 마세요.
              '기온: 몇 도'처럼 항목을 나열하지 말고 조사와 서술어가 있는 완성된 문장으로 전달하세요.
              예를 들어 '현재 기온은 [기온]도이며, 체감온도는 [체감온도]도입니다.'처럼 말하세요.
              대괄호와 자리표시자는 출력하지 말고, 확인된 실제 값으로만 채우세요.
              기온은 '도', 확률과 습도는 '퍼센트'로 읽고 단위 기호는 자연스러운 말로 풀어 쓰세요.
              숫자와 정보를 한 문장에 지나치게 몰아넣지 말고, 전체는 짧은 다섯~일곱 문장으로 구성하세요.
              제목, 목록, 콜론, 마크다운, 이모지, 괄호 설명, 연출 지시 없이 읽을 원고만 출력하세요.

              사실과 시제:
              자료에 없는 강수 시각, 시간대별 변화, 내일 날씨, 어제·평년과의 비교,
              기압계, 기상특보나 다른 지역의 날씨를 만들어내지 마세요.
              강수확률만으로 비가 반드시 온다고 단정하거나, 현재 날씨를 하루 전체 예보로 확대하지 마세요.
              오늘 최저·최고기온에 임의로 아침·낮·밤의 시각을 붙이지 마세요.
              요청 시각에 맞는 시제를 사용하고 저녁이나 밤에 '오늘 낮에는 오르겠습니다'처럼 말하지 마세요.
              날씨와 관련 없는 일정, 주식, 뉴스, 출근 응원은 넣지 마세요.

              데이터 누락 처리:
              unknown, unavailable, None, N/A, 빈 값은 확인할 수 없는 정보입니다.
              확인할 수 없는 값은 추측하거나 0으로 바꾸지 말고 해당 항목을 생략하세요.
              일부 정보가 빠졌다면 '일부 날씨 정보는 현재 확인이 어렵습니다.'라고 한 번만 안내하세요.
              모든 정보가 없으면 '현재 날씨 정보를 확인할 수 없습니다. 잠시 후 다시 확인해 주세요.'라고만 말하세요.
              이 규칙은 위의 항목과 문장 수 규칙보다 우선합니다.
          response_variable: ai_response
          continue_on_error: true
        - if:
            - condition: template
              value_template: >-
                {{ ai_response is defined
                   and ai_response is mapping
                   and ai_response.data is defined
                   and ai_response.data is string
                   and ai_response.data | trim | length > 0 }}
          then:
            - action: tts.speak
              target:
                entity_id: tts.google_ai_tts
              data:
                media_player_entity_id: media_player.geosil
                message: '{{ ai_response.data | trim }}'
                options:
                  voice: Leda
                cache: false
            - stop: 날씨 안내 TTS 요청 완료
        - if:
            - condition: template
              value_template: '{{ repeat.index < 3 }}'
          then:
            - delay:
                seconds: 2
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.geosil
      message: 오빠, 지금은 날씨 안내를 만들지 못했어. 잠시 후 다시 물어봐줘.
      options:
        voice: Leda
      cache: false
mode: single
