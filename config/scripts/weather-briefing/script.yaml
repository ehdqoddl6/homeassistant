alias: 날씨 알려줘
description: 날씨 센서로 Gemini가 날씨 안내 원고를 생성하고 거실 스피커로 재생 (생성 최대 3회 시도)
sequence:
  - repeat:
      count: 3
      sequence:
        - variables:
            ai_response: {}
        - action: ai_task.generate_data
          data:
            task_name: 날씨 알려줘
            entity_id: ai_task.google_ai_task
            instructions: >-
              아래 날씨 정보를 바탕으로 스피커로 바로 읽을 한국어 안내 원고를 작성해줘.
              오빠에게 이야기하듯 다정하고 자연스러운 반말로만 말해줘. 존댓말은 쓰지 마.
              '오빠'는 처음이나 끝에 한 번 정도만 자연스럽게 사용해줘.

              현재 시각은 {{ now().strftime('%m월 %d일 %H시 %M분') }}이야.

              [날씨 자료]
              현재 날씨: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaenalssi') }}
              현재 기온: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaeondo') }} °C
              체감온도: {{ states('sensor.naver_weather_hopyeongdong_nalssi_cegamondo') }} °C
              오늘 최저기온: {{ states('sensor.naver_weather_hopyeongdong_nalssi_coejeoondo') }} °C
              오늘 최고기온: {{ states('sensor.naver_weather_hopyeongdong_nalssi_coegoondo') }} °C
              습도: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaeseubdo') }} %
              강수확률: {{ states('sensor.naver_weather_hopyeongdong_nalssi_gangsuhwagryul') }} %
              풍향: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaepunghyang') }}
              풍속: {{ states('sensor.naver_weather_hopyeongdong_nalssi_hyeonjaepungsog') }} m/s
              통합대기: {{ states('sensor.naver_weather_hopyeongdong_nalssi_tonghabdaegi') }}
              미세먼지 농도: {{ states('sensor.naver_weather_hopyeongdong_nalssi_misemeonji') }} ㎍/㎥
              미세먼지 등급: {{ states('sensor.naver_weather_hopyeongdong_nalssi_misemeonjideunggeub') }}
              초미세먼지 농도: {{ states('sensor.naver_weather_hopyeongdong_nalssi_comisemeonji') }} ㎍/㎥
              초미세먼지 등급: {{ states('sensor.naver_weather_hopyeongdong_nalssi_comisemeonjideunggeub') }}
              자외선 등급: {{ states('sensor.naver_weather_hopyeongdong_nalssi_jaoeseondeunggeub') }}

              말할 내용:
              현재 날씨와 기온, 체감온도를 먼저 알려주고 오늘 최저·최고기온,
              강수확률과 습도, 미세먼지와 초미세먼지 상태를 자연스럽게 이어서 알려줘.
              바람과 자외선 정보는 주의가 필요할 때 짧게 덧붙여줘.
              먼지는 제공된 등급을 우선 사용하고, 등급 없이 농도만 있으면 수치만 알려줘.
              마지막에는 확인 가능한 날씨에 맞춰 우산이나 옷차림 팁을 한마디만 덧붙여줘.
              비가 오는 시각이나 시간대별 예보처럼 자료에 없는 내용은 추측하지 마.
              날씨와 관련 없는 일정, 주식, 뉴스, 출근 응원은 넣지 마.

              말투와 형식:
              '기온: 몇 도'처럼 항목을 나열하지 말고 '지금 기온은 몇 도이고,
              체감온도는 몇 도 정도야'처럼 조사와 서술어를 갖춘 문장으로 말해줘.
              '몇 도' 같은 예시 표현은 실제 자료의 값으로 바꿔줘.
              기온은 '도', 확률과 습도는 '퍼센트'로 읽고 단위 기호는 말로 풀어줘.
              제목, 목록, 콜론, 마크다운, 이모지, 괄호 설명 없이 읽을 원고만 출력해줘.
              전체는 짧은 다섯~일곱 문장 정도로 작성해줘.

              데이터가 unknown, unavailable, None, N/A, 빈 값이면 해당 값은 확인할 수 없는 거야.
              확인할 수 없는 값은 추측하거나 0으로 바꾸지 말고 해당 항목을 생략해줘.
              일부 정보가 빠졌다면 '일부 날씨 정보는 지금 확인이 어려워'라고 한 번만 알려줘.
              모든 정보가 없으면 '오빠, 지금은 날씨 정보를 확인하기 어려워. 잠시 후 다시 물어봐줘.'라고만 말해줘.
              이 누락 처리 규칙은 위의 항목과 문장 수 규칙보다 우선해.
          response_variable: ai_response
          continue_on_error: true
        - if:
            - condition: template
              value_template: >-
                {{ ai_response is defined
                   and ai_response is mapping
                   and ai_response.data is defined
                   and ai_response.data is string
                   and ai_response.data | trim | length > 0 }}
          then:
            - action: tts.speak
              target:
                entity_id: tts.google_ai_tts
              data:
                media_player_entity_id: media_player.geosil
                message: '{{ ai_response.data | trim }}'
                options:
                  voice: Leda
                cache: false
            - stop: 날씨 안내 TTS 요청 완료
        - if:
            - condition: template
              value_template: '{{ repeat.index < 3 }}'
          then:
            - delay:
                seconds: 2
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.geosil
      message: 오빠, 지금은 날씨 안내를 만들지 못했어. 잠시 후 다시 물어봐줘.
      options:
        voice: Leda
      cache: false
mode: single
