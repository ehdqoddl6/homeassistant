alias: 원달러 환율 알려줘
description: 원달러 환율 센서로 Gemini가 짧은 안내 원고를 생성하고 거실 스피커로 재생 (생성 최대 3회 시도)
sequence:
  - variables:
      exchange_rate: "{{ states('sensor.yahoofinance_krw_x') }}"
  - repeat:
      count: 3
      sequence:
        - variables:
            ai_response: {}
        - action: ai_task.generate_data
          data:
            task_name: 원달러 환율 알려줘
            entity_id: ai_task.google_ai_task
            instructions: >-
              당신은 국제금융 소식을 전하는 경제 전문 앵커입니다.
              아래 원달러 환율을 중심으로, 라디오에서 짧은 시황 브리핑을 진행하듯 자연스럽게 전달하세요.
              차분하고 신뢰감 있는 존댓말을 사용하고 청취자에게 개인적인 호칭을 붙이지 마세요.

              정해진 문장 틀이나 고정된 인사말을 따르지 말고 도입, 연결, 마무리를 자유롭게 구성하세요.
              금융 브리핑을 시작하는 느낌을 살리면서 원달러 환율 이야기로 자연스럽게 이어가세요.
              문장 수와 순서를 억지로 맞추지 말고, 같은 수치를 반복하거나 내용 없이 길게 늘이지 마세요.
              필요하면 환율의 의미를 이해하는 데 도움이 되는 일반적인 설명을 짧게 덧붙이되,
              오늘 실제로 발생한 변화나 사건인 것처럼 말하지 마세요.

              [조회된 환율]
              미국 달러 1달러당 대한민국 원화: {{ exchange_rate }} 원

              환율은 미국 달러 1달러당 원화 금액이라는 의미가 분명하게 전달되도록 말하세요.
              숫자는 소수점 둘째 자리까지 반올림하고 불필요한 끝자리 0은 생략하세요.
              통화 기호나 USD, KRW 같은 코드는 읽지 말고 '달러', '원'으로 풀어 말하세요.
              항목을 나열하지 말고 완성된 문장으로 연결하며, 스피커로 읽을 원고만 출력하세요.
              제목, 목록, 콜론, 마크다운, 이모지, 괄호 설명이나 연출 지시는 넣지 마세요.

              입력으로 확인할 수 있는 시황 정보는 이 환율 값 하나뿐이며 시세 기준 시각은 없습니다.
              실시간·당일 마감·방금 갱신된 시세라고 단정하지 말고 조회된 값 기준임을 자연스럽게 드러내세요.
              전일 대비 등락, 달러 강세·약세, 고환율·저환율 평가, 시장 변동성, 등락 원인과 향후 전망을 추측하지 마세요.
              제공되지 않은 국제금융 뉴스, 금리 결정, 경제지표, 다른 통화나 주식 시세를 만들어내지 마세요.
              은행의 현찰 매매·송금·수수료 적용 환율로 설명하거나 환전 시점·투자를 권하지 마세요.
              방송사명이나 앵커 이름을 지어내거나 공식 기관의 발표인 것처럼 말하지 마세요.

              값이 unknown, unavailable, None, N/A, 빈 값이거나 유효한 양수가 아니면
              환율을 확인하기 어렵다는 사실만 짧은 존댓말로 안내하세요.
              확인할 수 없는 값을 추측하거나 0원으로 바꾸지 말고, 브리핑을 억지로 이어가지 마세요.
          response_variable: ai_response
          continue_on_error: true
        - if:
            - condition: template
              value_template: >-
                {{ ai_response is defined
                   and ai_response is mapping
                   and ai_response.data is defined
                   and ai_response.data is string
                   and ai_response.data | trim | length > 0 }}
          then:
            - action: tts.speak
              target:
                entity_id: tts.google_ai_tts
              data:
                media_player_entity_id: media_player.geosil
                message: '{{ ai_response.data | trim }}'
                options:
                  voice: Leda
                cache: false
            - stop: 원달러 환율 안내 TTS 요청 완료
        - if:
            - condition: template
              value_template: '{{ repeat.index < 3 }}'
          then:
            - delay:
                seconds: 2
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      media_player_entity_id: media_player.geosil
      message: 오빠, 지금은 원달러 환율 안내를 만들지 못했어. 잠시 후 다시 물어봐줘.
      options:
        voice: Leda
      cache: false
mode: single
