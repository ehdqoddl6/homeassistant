alias: 제습기 2시간 후 자동 끄기
description: 제습기가 켜진 후 2시간이 지나면 자동으로 끕니다.
triggers:
  - entity_id: switch.jeseubgi
    to: "on"
    trigger: state
actions:
  - delay: "02:00:00"
  - condition: state
    entity_id: switch.jeseubgi
    state: "on"
  - target:
      entity_id: switch.jeseubgi
    action: switch.turn_off
mode: restart
