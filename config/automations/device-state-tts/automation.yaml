alias: 기기 상태 변경 TTS 알림
description: 제습기 켜짐·꺼짐, 안방 선풍기 꺼짐, 환풍기 켜짐·꺼짐을 거실 스피커로 안내
triggers:
  - trigger: state
    entity_id: switch.jeseubgi
    to: "on"
    id: dehumidifier_on
  - trigger: state
    entity_id: switch.jeseubgi
    to: "off"
    id: dehumidifier_off
  - trigger: state
    entity_id: switch.fan_m
    to: "off"
    id: bedroom_fan_off
  - trigger: state
    entity_id: fan.kocom_ventilation_0_0
    to: "on"
    id: ventilation_on
  - trigger: state
    entity_id: fan.kocom_ventilation_0_0
    to: "off"
    id: ventilation_off
conditions: []
actions:
  - delay:
      seconds: "{{ 4 if trigger.id in ['dehumidifier_on', 'ventilation_on'] else 1 }}"
  - condition: template
    value_template: "{{ is_state(trigger.entity_id, trigger.to_state.state) }}"
  - action: tts.speak
    target:
      entity_id: tts.google_ai_tts
    data:
      cache: true
      media_player_entity_id: media_player.geosil
      message: >-
        {% if trigger.id == 'dehumidifier_on' %}
          제습을 시작합니다.
        {% elif trigger.id == 'dehumidifier_off' %}
          제습을 종료합니다.
        {% elif trigger.id == 'bedroom_fan_off' %}
          안방 화장실 선풍기가 꺼졌습니다.
        {% elif trigger.id == 'ventilation_on' %}
          환기를 시작합니다.
        {% else %}
          환기를 종료합니다.
        {% endif %}
      options:
        voice: Leda
mode: parallel
max: 10
